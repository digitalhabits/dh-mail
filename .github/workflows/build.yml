# Build Digital Habits: Mail for macOS and Windows, from this public source.
#
# This file is written into the public repository by the export script
# (scripts/export-mail-mirror.mjs in the private monorepo). Edit it there, in
# apps/mail/mirror/workflows/build.yml. A change made here is lost at the next
# export.
#
# What a run makes:
#
#   mac      one universal .dmg (Apple silicon and Intel), signed, notarized
#            and stapled. `pnpm --dir apps/mail app:build`.
#   windows  two NSIS installers, x64 and ARM64, signed with Azure Trusted
#            Signing. `pnpm --dir apps/mail app:build:win`.
#   release  a DRAFT release "v<version>" with the files above and their
#            checksums. A person reads it and publishes it. Nothing here
#            publishes.
#   store    optional: one .msix for each architecture, for the Microsoft
#            Store. `pnpm --dir apps/mail app:build:win-store`. It is not
#            signed, because Partner Center signs it again on upload. It stays
#            an artifact of the run and does not go into the release: a person
#            uploads it in Partner Center, and nobody installs it from here.
#
# Each file also gets a build provenance attestation. Anybody can then check
# that a download was built here, from this commit:
#
#   gh attestation verify <file> --repo digitalhabits/dh-mail
#
# Trigger: Actions -> "Build" -> Run workflow. There is no other trigger, and
# there must never be one. A run on a pull request would build a stranger's
# code with the signing secrets in reach.
#
# The secrets are in the environment "release", which has a required reviewer.
# So each job waits for an approval before it can read them.
#
#   For all builds (the OAuth clients, baked into the page at build time):
#     VITE_GOOGLE_CLIENT_ID, VITE_GOOGLE_CLIENT_SECRET, VITE_MICROSOFT_CLIENT_ID
#   For macOS:
#     APPLE_CERTIFICATE            base64 of the Developer ID Application .p12
#     APPLE_CERTIFICATE_PASSWORD   the password of that .p12
#     APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID   for notarization
#     APPLE_PROVISIONING_PROFILE   optional, base64. With it the tokens go to
#                                  the data-protection keychain.
#   For Windows:
#     AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_CLIENT_SECRET,
#     AZURE_SIGNING_ACCOUNT, AZURE_SIGNING_PROFILE
#
# Each action is pinned to a commit, with its version beside it. A tag can be
# moved to other code. A commit cannot.

name: Build

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "What to build"
        type: choice
        default: both
        options: [both, mac, windows]
      windows_architecture:
        description: "Windows architectures"
        type: choice
        default: both
        options: [both, x64, arm64]
      draft_release:
        description: "Put the files in a draft release"
        type: boolean
        default: true
      store_package:
        description: "Also build the Microsoft Store package (.msix)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  mac:
    if: inputs.platform == 'both' || inputs.platform == 'mac'
    runs-on: macos-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
      VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_PROVISIONING_PROFILE: ${{ secrets.APPLE_PROVISIONING_PROFILE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.14.4 --activate

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mail/src-tauri/target
          key: cargo-mac-${{ hashFiles('apps/mail/src-tauri/Cargo.lock') }}
          restore-keys: cargo-mac-

      - name: Install
        run: pnpm install --frozen-lockfile

      # An app that cannot sign in to a mailbox, or that no other Mac will
      # open, is not worth the run. Stop before the compile, not after it.
      - name: Check the secrets
        run: |
          missing=""
          for name in VITE_GOOGLE_CLIENT_ID VITE_GOOGLE_CLIENT_SECRET VITE_MICROSOFT_CLIENT_ID \
                      APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These secrets are missing from the environment \"release\":$missing"
            exit 1
          fi

      # `.env.production.local`, and not `.env.local`: the build scripts read
      # `.env.local` for the signing names. Vite reads both in a production
      # build.
      - name: Write the OAuth clients
        run: |
          {
            echo "VITE_GOOGLE_CLIENT_ID=$VITE_GOOGLE_CLIENT_ID"
            echo "VITE_GOOGLE_CLIENT_SECRET=$VITE_GOOGLE_CLIENT_SECRET"
            echo "VITE_MICROSOFT_CLIENT_ID=$VITE_MICROSOFT_CLIENT_ID"
          } >> apps/mail/.env.production.local

      # With the profile, the build script adds the keychain entitlement.
      # Without it the script leaves the entitlement out, because macOS kills
      # an app that claims it with no profile.
      - name: Write the provisioning profile
        if: env.APPLE_PROVISIONING_PROFILE != ''
        run: echo "$APPLE_PROVISIONING_PROFILE" | base64 --decode > apps/mail/src-tauri/embedded.provisionprofile

      - name: Read the version
        id: version
        run: node -p "'version=' + require('./apps/mail/package.json').version" >> "$GITHUB_OUTPUT"

      # Tauri reads APPLE_CERTIFICATE and its password, and puts the
      # certificate in a keychain of its own for this build. The script then
      # notarizes and staples the disk image too.
      - name: Build
        run: pnpm --dir apps/mail app:build

      # The build script writes the checksum with the path it built at. A
      # reader checks a file in their Downloads folder, so write it again with
      # the file name only.
      - name: Write the checksums
        working-directory: apps/mail/for-distribution
        run: |
          for file in *.dmg; do
            shasum -a 256 "$file" > "$file.sha256"
          done

      - name: Say what was built
        working-directory: apps/mail/for-distribution
        run: |
          {
            echo "## Digital Habits Mail ${{ steps.version.outputs.version }} — macOS"
            echo
            for file in *.dmg; do
              echo "- \`$file\` — $(du -h "$file" | cut -f1)"
              echo "  \`$(cut -d' ' -f1 "$file.sha256")\`"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Attest where the image came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/mail/for-distribution/*.dmg

      - name: Keep the image
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mail-mac-${{ steps.version.outputs.version }}
          path: |
            apps/mail/for-distribution/*.dmg
            apps/mail/for-distribution/*.sha256
          if-no-files-found: error
          retention-days: 30

  windows:
    if: inputs.platform == 'both' || inputs.platform == 'windows'
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
      VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      AZURE_SIGNING_ACCOUNT: ${{ secrets.AZURE_SIGNING_ACCOUNT }}
      AZURE_SIGNING_PROFILE: ${{ secrets.AZURE_SIGNING_PROFILE }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.14.4 --activate

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mail/src-tauri/target
          key: cargo-windows-${{ hashFiles('apps/mail/src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Install
        run: pnpm install --frozen-lockfile

      # A release must be signed. An unsigned installer shows an unknown
      # publisher, and SmartScreen can hold it back.
      - name: Check the secrets
        shell: bash
        run: |
          missing=""
          for name in VITE_GOOGLE_CLIENT_ID VITE_GOOGLE_CLIENT_SECRET VITE_MICROSOFT_CLIENT_ID \
                      AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_CLIENT_SECRET \
                      AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These secrets are missing from the environment \"release\":$missing"
            exit 1
          fi

      - name: Install trusted-signing-cli
        shell: pwsh
        run: |
          if (-not (Test-Path (Join-Path $env:USERPROFILE '.cargo\bin\trusted-signing-cli.exe'))) {
            cargo install trusted-signing-cli --locked
          }
          Add-Content -Path $env:GITHUB_PATH -Value (Join-Path $env:USERPROFILE '.cargo\bin')

      # See the same step in the mac job.
      - name: Write the OAuth clients
        shell: bash
        run: |
          {
            echo "VITE_GOOGLE_CLIENT_ID=$VITE_GOOGLE_CLIENT_ID"
            echo "VITE_GOOGLE_CLIENT_SECRET=$VITE_GOOGLE_CLIENT_SECRET"
            echo "VITE_MICROSOFT_CLIENT_ID=$VITE_MICROSOFT_CLIENT_ID"
          } >> apps/mail/.env.production.local

      - name: Read the version
        id: version
        shell: bash
        run: node -p "'version=' + require('./apps/mail/package.json').version" >> "$GITHUB_OUTPUT"

      - name: Build
        working-directory: apps/mail
        shell: pwsh
        run: |
          switch ('${{ inputs.windows_architecture }}') {
            'x64'   { pnpm app:build:win -x64Only }
            'arm64' { pnpm app:build:win -arm64Only }
            default { pnpm app:build:win }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Say what was built
        shell: pwsh
        run: |
          $dist = 'apps/mail/for-distribution'
          $lines = @("## Digital Habits Mail ${{ steps.version.outputs.version }} — Windows", '')
          foreach ($file in Get-ChildItem "$dist/*.exe") {
            $sum = "$($file.FullName).sha256"
            $digest = if (Test-Path $sum) { (Get-Content $sum -Raw).Split(' ')[0] } else { '(none)' }
            $mb = [math]::Round($file.Length / 1MB, 1)
            $lines += "- ``$($file.Name)`` — $mb MB"
            $lines += "  `n  ``$digest``"
          }
          $lines | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Attest where the installers came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/mail/for-distribution/*.exe

      - name: Keep the installers
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mail-windows-${{ steps.version.outputs.version }}
          path: |
            apps/mail/for-distribution/*.exe
            apps/mail/for-distribution/*.sha256
          if-no-files-found: error
          retention-days: 30

  # The Store package. It is a different build, not the installer in another
  # wrapper: nothing is signed, no WebView2 bootstrapper is carried, and the
  # package holds the identity that Partner Center gave this product. That
  # identity is in build-win-store.ps1. It is not a secret: each package that
  # ships shows it.
  store:
    if: inputs.store_package
    runs-on: windows-latest
    timeout-minutes: 90
    environment: release
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
      VITE_MICROSOFT_CLIENT_ID: ${{ secrets.VITE_MICROSOFT_CLIENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.14.4 --activate

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      # The same key as the windows job: the two compile the same crates.
      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/mail/src-tauri/target
          key: cargo-windows-${{ hashFiles('apps/mail/src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Install
        run: pnpm install --frozen-lockfile

      # The package is not signed here, but it must be able to sign in to a
      # mailbox.
      - name: Check the secrets
        shell: bash
        run: |
          missing=""
          for name in VITE_GOOGLE_CLIENT_ID VITE_GOOGLE_CLIENT_SECRET VITE_MICROSOFT_CLIENT_ID; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::These secrets are missing from the environment \"release\":$missing"
            exit 1
          fi

      # See the same step in the mac job.
      - name: Write the OAuth clients
        shell: bash
        run: |
          {
            echo "VITE_GOOGLE_CLIENT_ID=$VITE_GOOGLE_CLIENT_ID"
            echo "VITE_GOOGLE_CLIENT_SECRET=$VITE_GOOGLE_CLIENT_SECRET"
            echo "VITE_MICROSOFT_CLIENT_ID=$VITE_MICROSOFT_CLIENT_ID"
          } >> apps/mail/.env.production.local

      - name: Read the version
        id: version
        shell: bash
        run: node -p "'version=' + require('./apps/mail/package.json').version" >> "$GITHUB_OUTPUT"

      - name: Package
        working-directory: apps/mail
        shell: pwsh
        run: |
          switch ('${{ inputs.windows_architecture }}') {
            'x64'   { pnpm app:build:win-store -x64Only }
            'arm64' { pnpm app:build:win-store -arm64Only }
            default { pnpm app:build:win-store }
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Say what was packaged
        shell: pwsh
        run: |
          $lines = @("## Digital Habits Mail ${{ steps.version.outputs.version }} — Microsoft Store package", '')
          foreach ($file in Get-ChildItem 'apps/mail/for-distribution/*.msix') {
            $mb = [math]::Round($file.Length / 1MB, 1)
            $lines += "- ``$($file.Name)`` — $mb MB"
          }
          $lines | Add-Content $env:GITHUB_STEP_SUMMARY

      - name: Attest where the packages came from
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: apps/mail/for-distribution/*.msix

      # The name does not start with "mail-", so the release job leaves it out.
      - name: Keep the packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-msix-${{ steps.version.outputs.version }}
          path: apps/mail/for-distribution/*.msix
          if-no-files-found: error
          retention-days: 30

  # A draft, and only a draft. It has no public page until a person publishes
  # it. A run for the same version puts the new files over the old ones.
  release:
    needs: [mac, windows]
    if: ${{ !cancelled() && !failure() && inputs.draft_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.mac.outputs.version || needs.windows.outputs.version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          # Not the Store package: see the head of this file.
          pattern: mail-*
          path: files
          merge-multiple: true

      - name: Put the files in a draft release
        run: |
          ls -l files
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            if [ "$(gh release view "$tag" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "::error::Release $tag is published. This run does not change a published release. Bump the version."
              exit 1
            fi
            gh release upload "$tag" files/* --clobber
          else
            gh release create "$tag" files/* \
              --draft \
              --target "${{ github.sha }}" \
              --title "Digital Habits: Mail $VERSION" \
              --notes "Built from this source by the Build workflow. Check a download with: gh attestation verify <file> --repo ${{ github.repository }}"
          fi
