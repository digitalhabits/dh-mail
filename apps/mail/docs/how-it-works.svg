<svg xmlns="http://www.w3.org/2000/svg" width="680" height="490" viewBox="0 0 680 490" role="img" aria-labelledby="title desc">
  <title id="title">How Digital Habits: Mail works</title>
  <desc id="desc">The app runs on your computer: the Mail window, the Mail core, a local copy of your mail and the system keychain. The app connects directly to Gmail, Outlook and Microsoft 365, or your own Exchange server. The only other connections are checks for new versions from GitHub, and an anonymous usage count that can be turned off. Neither sends any of your email.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .h { font-size: 14px; font-weight: 500; fill: #2C2C2A; }
    .s { font-size: 12px; fill: #5F5E5A; }
    .teal { fill: #E1F5EE; stroke: #0F6E56; stroke-width: 1; }
    .teal-h { font-size: 14px; font-weight: 500; fill: #085041; }
    .teal-s { font-size: 12px; fill: #0F6E56; }
    .gray { fill: #F1EFE8; stroke: #888780; stroke-width: 1; }
    .frame { fill: none; stroke: #B4B2A9; stroke-width: 1; stroke-dasharray: 5 4; }
    .direct { stroke: #1D9E75; stroke-width: 1.5; fill: none; }
    .other { stroke: #888780; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    .head-direct { stroke: #1D9E75; }
    .head-other { stroke: #888780; }
    @media (prefers-color-scheme: dark) {
      .h { fill: #F1EFE8; }
      .s { fill: #B4B2A9; }
      .teal { fill: #04342C; stroke: #5DCAA5; }
      .teal-h { fill: #E1F5EE; }
      .teal-s { fill: #9FE1CB; }
      .gray { fill: #2C2C2A; stroke: #888780; }
      .frame { stroke: #5F5E5A; }
      .direct { stroke: #5DCAA5; }
      .other { stroke: #B4B2A9; }
      .head-direct { stroke: #5DCAA5; }
      .head-other { stroke: #B4B2A9; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-direct" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrow-other" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="head-other" d="M2 1L8 5L2 9" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <rect class="frame" x="40" y="40" width="280" height="400" rx="12"/>
  <text class="h" x="60" y="66">Your computer</text>

  <rect class="teal" x="60" y="84" width="240" height="56" rx="4"/>
  <text class="teal-h" x="180" y="107" text-anchor="middle">Mail window</text>
  <text class="teal-s" x="180" y="127" text-anchor="middle">The interface you see</text>

  <rect class="teal" x="60" y="180" width="240" height="56" rx="4"/>
  <text class="teal-h" x="180" y="203" text-anchor="middle">Mail core</text>
  <text class="teal-s" x="180" y="223" text-anchor="middle">Syncs, sends, signs in</text>

  <rect class="teal" x="60" y="300" width="115" height="56" rx="4"/>
  <text class="teal-h" x="117" y="323" text-anchor="middle">Local copy</text>
  <text class="teal-s" x="117" y="343" text-anchor="middle">SQLite on disk</text>

  <rect class="teal" x="185" y="300" width="115" height="56" rx="4"/>
  <text class="teal-h" x="242" y="323" text-anchor="middle">Keychain</text>
  <text class="teal-s" x="242" y="343" text-anchor="middle">Tokens, passwords</text>

  <line class="direct" x1="180" y1="142" x2="180" y2="176" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="direct" x1="117" y1="238" x2="117" y2="296" marker-end="url(#arrow)"/>
  <line class="direct" x1="242" y1="238" x2="242" y2="296" marker-end="url(#arrow)"/>

  <rect class="gray" x="400" y="60" width="240" height="56" rx="4"/>
  <text class="h" x="520" y="83" text-anchor="middle">Gmail</text>
  <text class="s" x="520" y="103" text-anchor="middle">IMAP, SMTP and Google APIs</text>

  <rect class="gray" x="400" y="140" width="240" height="56" rx="4"/>
  <text class="h" x="520" y="163" text-anchor="middle">Outlook, Microsoft 365</text>
  <text class="s" x="520" y="183" text-anchor="middle">Microsoft Graph API</text>

  <rect class="gray" x="400" y="220" width="240" height="56" rx="4"/>
  <text class="h" x="520" y="243" text-anchor="middle">Your Exchange server</text>
  <text class="s" x="520" y="263" text-anchor="middle">EWS, https only</text>

  <line class="direct" x1="322" y1="88" x2="396" y2="88" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="direct" x1="322" y1="168" x2="396" y2="168" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <line class="direct" x1="322" y1="248" x2="396" y2="248" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <rect class="frame" x="400" y="300" width="240" height="56" rx="4"/>
  <text class="h" x="520" y="323" text-anchor="middle">App updates</text>
  <text class="s" x="520" y="343" text-anchor="middle">New versions, from GitHub</text>

  <rect class="frame" x="400" y="376" width="240" height="56" rx="4"/>
  <text class="h" x="520" y="399" text-anchor="middle">Usage count</text>
  <text class="s" x="520" y="419" text-anchor="middle">Anonymous, can be turned off</text>

  <line class="other" x1="396" y1="328" x2="322" y2="328" marker-end="url(#arrow-other)"/>
  <line class="other" x1="322" y1="404" x2="396" y2="404" marker-end="url(#arrow-other)"/>

  <line class="direct" x1="40" y1="466" x2="72" y2="466"/>
  <text class="s" x="80" y="470">Your email and sign-in, direct</text>
  <line class="other" x1="330" y1="466" x2="362" y2="466"/>
  <text class="s" x="370" y="470">Sends none of your email</text>
</svg>
