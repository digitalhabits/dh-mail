<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Apple's app-icon template: the tile is 824 px on a 1024 canvas, with a
       transparent margin of 100 px round it. Drawn edge to edge, the icon
       sat in the Dock a fifth larger than every icon beside it. -->
