    <rect width="1024" height="1024" rx="230" fill="#f1eee9"></rect>
    <g fill="none" stroke="#1e2d3e" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" transform="translate(104,104) scale(34)">
      <rect x="3" y="5.5" width="18" height="13" rx="2.2"></rect>
      <path d="M3.5 7l8.5 6 8.5-6"></path>
    </g>
  </g>
</svg>
