# Run the development binary through the signer first. See sign-dev.sh: cargo
# signs a debug build ad-hoc, the signature changes on every rebuild, and the
# keychain then treats each build as a new app and asks for a password again.
#
# Both architectures, so this holds on an Intel Mac too.

[target.aarch64-apple-darwin]
runner = "./sign-dev.sh"

[target.x86_64-apple-darwin]
runner = "./sign-dev.sh"

# Control Flow Guard on Windows. The compiler writes the list of functions an
# indirect call is allowed to reach, and Windows stops a call that goes
# anywhere else. This covers the code built from this tree. The standard
# library arrives already compiled and is not covered: to instrument that too
# needs a nightly toolchain, and this app builds on stable.

[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "control-flow-guard"]

[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "control-flow-guard"]
